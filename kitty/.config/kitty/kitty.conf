# vim:ft=kitty

## name:     Catppuccin Kitty Mocha
## author:   Catppuccin Org
## license:  MIT
## upstream: https://github.com/catppuccin/kitty/blob/main/themes/mocha.conf
## blurb:    Soothing pastel theme for the high-spirited!

# Fonts
font_size        14.0
font_family      JetBrainsMono Nerd Font Propo
symbol_map       U+F04B-U+F04D MesloLGM Nerd Font Mono


# The basic colors
# foreground              #CDD6F4
# background              #11111b
# selection_foreground    #1E1E2E
# selection_background    #F5E0DC

# Cursor colors
# cursor                  #F5E0DC
# cursor_text_color       #1E1E2E

# URL underline color when hovering with mouse
# url_color               #F5E0DC

# (AI-assisted) Shared Personal profile and new-window policy for terminal links.
open_url_with open-personal-link

# Kitty window border colors
# active_border_color     #B4BEFE
# inactive_border_color   #6C7086
# bell_border_color       #F9E2AF

# The width (in pts) of window borders. Will be rounded to the nearest number of pixels based on screen resolution.

window_border_width 2

window_margin_width 8

# OS Window titlebar colors
# wayland_titlebar_color system
# macos_titlebar_color system
hide_window_decorations titlebar-only


# Tab bar colors
# active_tab_foreground   #11111B
# active_tab_background   #CBA6F7
# inactive_tab_foreground #CDD6F4
# inactive_tab_background #181825
# tab_bar_background      #11111B

# Colors for marks (marked text in the terminal)
# mark1_foreground #1E1E2E
# mark1_background #B4BEFE
# mark2_foreground #1E1E2E
# mark2_background #CBA6F7
# mark3_foreground #1E1E2E
# mark3_background #74C7EC

# The 16 terminal colors

# black
# color0 #45475A
# color8 #585B70

# red
# color1 #F38BA8
# color9 #F38BA8

# green
# color2  #A6E3A1
# color10 #A6E3A1

# yellow
# color3  #F9E2AF
# color11 #F9E2AF

# blue
# color4  #89B4FA
# color12 #89B4FA

# magenta
# color5  #F5C2E7
# color13 #F5C2E7

# cyan
# color6  #94E2D5
# color14 #94E2D5

# white
# color7  #BAC2DE
# color15 #A6ADC8


# Shell
shell_integration disabled

background_opacity 0.90
dynamic_background_opacity yes

# Open Kitty scrollback in an isolated, plugin-free Neovim pager.
scrollback_pager nvim --noplugin -n -i NONE -u /home/vlermanda/.config/kitty/scrollback.lua --cmd "set eventignore=FileType" +"call nvim_open_term(0, {})" +"set nomodified nolist" +INPUT_LINE_NUMBER -

# Maps
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+c copy_or_interrupt


# BEGIN_KITTY_THEME
# Matugen
include current-theme.conf
# END_KITTY_THEME
