# Quick Note kitty profile. Keep normal kitty behavior untouched.
include kitty.conf

font_size 11.5
window_margin_width 6
background_opacity 0.97

foreground #000000
background #ffdab9
selection_foreground #000000
selection_background #f6c99f
cursor #a52a2a
cursor_text_color #ffdab9
url_color #406090
active_border_color #a52a2a
inactive_border_color #d89465
bell_border_color #c00058
wayland_titlebar_color #ffdab9

color0 #4a3428
color1 #a52a2a
color2 #2f6f3e
color3 #8b5a00
color4 #406090
color5 #c00058
color6 #2f6f6f
color7 #f4c7a3
color8 #6f4a39
color9 #c65f45
color10 #3f8f55
color11 #a86f00
color12 #5b76b8
color13 #d44f85
color14 #468989
color15 #ffead8

# This note profile favors editor-style clipboard shortcuts.
map ctrl+c send_text all \x03
map ctrl+v paste_from_clipboard
