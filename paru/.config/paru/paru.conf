# User configuration for the Paru AUR-malware security gate.
# Existing system settings are retained here because this user file takes
# precedence over /etc/paru.conf.

[options]
PgpFetch
Devel
Provides
NewsOnUpgrade
DevelSuffixes = -git -cvs -svn -bzr -darcs -always -hg -fossil

[bin]
# Static AUR-malware scanning runs before every AUR build.
PreBuildCommand = /home/vlermanda/.local/bin/paru-security-gate

# (AI-assisted) Local recipe overlay; Git URL preserves Paru's review step.
# Upstream Sioyek development Git still supplies the application source.
[unified-sioyek]
Url = file:///home/vlermanda/.local/share/unified-quickshell/pkgbuilds
